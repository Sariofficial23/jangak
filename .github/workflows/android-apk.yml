# Собирает APK приложения Jangak для Android (оболочка Capacitor вокруг сайта).
# Скачать готовый файл: вкладка Actions → нужный запуск → Artifacts → jangak-apk.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      # Переносит capacitor.config и локальную папку mobile/www в android/
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jangak-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
